<script>

    /* =====================================================
       YEAR
    ====================================================== */

    const currentYear =
        document.getElementById("currentYear");

    if (currentYear) {
        currentYear.textContent =
            new Date().getFullYear();
    }


    /* =====================================================
       MOBILE MENU
    ====================================================== */

    const menuButton =
        document.getElementById("menuButton");

    const mobileNav =
        document.getElementById("mobileNav");

    const mobileClose =
        document.getElementById("mobileClose");

    const mobileOverlay =
        document.getElementById("mobileOverlay");


    function openMobileMenu() {

        if (!mobileNav) {
            return;
        }

        mobileNav.classList.add("open");

        mobileOverlay.classList.add("show");

        document.body.style.overflow =
            "hidden";
    }


    function closeMobileMenu() {

        if (!mobileNav) {
            return;
        }

        mobileNav.classList.remove("open");

        mobileOverlay.classList.remove("show");

        document.body.style.overflow =
            "";
    }


    if (menuButton) {
        menuButton.addEventListener(
            "click",
            openMobileMenu
        );
    }


    if (mobileClose) {
        mobileClose.addEventListener(
            "click",
            closeMobileMenu
        );
    }


    if (mobileOverlay) {
        mobileOverlay.addEventListener(
            "click",
            closeMobileMenu
        );
    }


    document
        .querySelectorAll(".mobile-links a")
        .forEach(link => {

            link.addEventListener(
                "click",
                closeMobileMenu
            );

        });


    /* =====================================================
       REVEAL ANIMATION
    ====================================================== */

    const revealObserver =
        new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    if (entry.isIntersecting) {

                        entry.target
                            .classList
                            .add("visible");

                        revealObserver
                            .unobserve(
                                entry.target
                            );

                    }

                });

            },
            {
                threshold: 0.08
            }
        );


    document
        .querySelectorAll(".reveal")
        .forEach(element => {

            revealObserver.observe(element);

        });


    /* =====================================================
       BACK TO TOP
    ====================================================== */

    const backTop =
        document.getElementById("backTop");


    window.addEventListener(
        "scroll",
        () => {

            if (!backTop) {
                return;
            }

            if (window.scrollY > 500) {

                backTop.classList
                    .add("show");

            } else {

                backTop.classList
                    .remove("show");

            }

        },
        {
            passive: true
        }
    );


    if (backTop) {

        backTop.addEventListener(
            "click",
            () => {

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }
        );

    }


    /* =====================================================
       LIVE SPORTS
       SPORT SCORE API
    ====================================================== */

    const sportTabs =
        document.querySelectorAll(
            ".sport-tab"
        );

    const sportsGrid =
        document.getElementById(
            "sportsGrid"
        );


    const sportIcons = {

        cricket:
            "fa-baseball-bat-ball",

        football:
            "fa-futbol",

        tennis:
            "fa-table-tennis-paddle-ball",

        basketball:
            "fa-basketball"

    };


    const sportNames = {

        cricket:
            "Cricket",

        football:
            "Football",

        tennis:
            "Tennis",

        basketball:
            "Basketball"

    };


    const sportColors = {

        cricket:
            "cricket",

        football:
            "football",

        tennis:
            "tennis",

        basketball:
            "basketball"

    };


    let liveSportsData = [];


    function escapeSportHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function getTeamName(team) {

        if (!team) {
            return "Unknown";
        }

        if (typeof team === "string") {
            return team;
        }

        return (
            team.name ||
            team.title ||
            team.shortName ||
            "Unknown"
        );

    }


    function getScore(score) {

        if (
            score === null ||
            score === undefined
        ) {
            return "-";
        }

        if (typeof score === "string") {
            return score;
        }

        if (typeof score === "number") {
            return String(score);
        }

        return (
            score.display ||
            score.value ||
            score.current ||
            score.total ||
            "-"
        );

    }


    function getMatchStatus(match) {

        return (
            match.status?.short ||
            match.status?.long ||
            match.statusText ||
            match.status ||
            match.state ||
            "LIVE"
        );

    }


    function isMatchLive(match) {

        const text =
            JSON.stringify(match)
                .toLowerCase();

        return (
            text.includes("live") ||
            text.includes("in progress") ||
            text.includes("playing")
        );

    }


    function getMatchTeams(match) {

        const home =
            match.home ||
            match.homeTeam ||
            match.team1 ||
            match.participant1 ||
            match.teams?.home ||
            match.teams?.[0];

        const away =
            match.away ||
            match.awayTeam ||
            match.team2 ||
            match.participant2 ||
            match.teams?.away ||
            match.teams?.[1];

        return {
            home: getTeamName(home),
            away: getTeamName(away)
        };

    }


    function getMatchScores(match) {

        const homeScore =
            match.homeScore ??
            match.home_score ??
            match.score?.home ??
            match.scores?.home ??
            match.result?.home;

        const awayScore =
            match.awayScore ??
            match.away_score ??
            match.score?.away ??
            match.scores?.away ??
            match.result?.away;

        return {
            home: getScore(homeScore),
            away: getScore(awayScore)
        };

    }


    function normalizeSportMatches(
        data,
        sport
    ) {

        const matches =
            Array.isArray(data)
                ? data
                : (
                    data.matches ||
                    data.data ||
                    data.results ||
                    []
                );


        return matches.map(
            match => {

                const teams =
                    getMatchTeams(match);

                const scores =
                    getMatchScores(match);

                return {

                    sport,

                    home:
                        teams.home,

                    away:
                        teams.away,

                    homeScore:
                        scores.home,

                    awayScore:
                        scores.away,

                    status:
                        getMatchStatus(match),

                    live:
                        isMatchLive(match),

                    raw:
                        match

                };

            }
        );

    }


    async function fetchSportMatches(
        sport
    ) {

        const url =
            `https://sportscore.com/api/widget/matches/?sport=${sport}&limit=10`;


        try {

            const response =
                await fetch(url, {
                    method: "GET",
                    headers: {
                        "Accept":
                            "application/json"
                    }
                });


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            return normalizeSportMatches(
                data,
                sport
            );

        } catch (error) {

            console.error(
                `SportScore ${sport} error:`,
                error
            );

            return [];

        }

    }


    function createSportCard(match) {

        const sport =
            match.sport;

        const sportClass =
            sportColors[sport] ||
            "football";

        const icon =
            sportIcons[sport] ||
            "fa-trophy";

        const sportName =
            sportNames[sport] ||
            sport;


        const liveBadge =
            match.live
                ? `
                    <span
                        style="
                            color:#ff3b5c;
                            font-weight:900;
                        "
                    >
                        ● LIVE
                    </span>
                `
                : `
                    <span>
                        ${escapeSportHTML(
                            match.status
                        )}
                    </span>
                `;


        return `

            <article
                class="sport-card ${sportClass}"
                data-sport-card="${escapeSportHTML(sport)}"
            >

                <div class="sport-icon">

                    <i class="fa-solid ${icon}"></i>

                </div>


                <div
                    style="
                        margin-top:15px;
                        color:#707b92;
                        font-size:8px;
                        font-weight:800;
                        text-transform:uppercase;
                        letter-spacing:1px;
                    "
                >
                    ${escapeSportHTML(
                        sportName
                    )}
                </div>


                <h3
                    class="sport-name"
                    style="
                        font-size:13px;
                        line-height:1.4;
                    "
                >
                    ${escapeSportHTML(
                        match.home
                    )}
                </h3>


                <div
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:space-between;
                        gap:10px;
                        margin-top:5px;
                    "
                >

                    <span
                        style="
                            color:white;
                            font-size:12px;
                            font-weight:900;
                        "
                    >
                        ${escapeSportHTML(
                            match.homeScore
                        )}
                    </span>

                    <span
                        style="
                            color:#707b92;
                            font-size:9px;
                        "
                    >
                        vs
                    </span>

                    <span
                        style="
                            color:white;
                            font-size:12px;
                            font-weight:900;
                            text-align:right;
                        "
                    >
                        ${escapeSportHTML(
                            match.awayScore
                        )}
                    </span>

                </div>


                <div
                    class="sport-status"
                >

                    <span
                        class="status-dot"
                        style="
                            background:
                            ${
                                match.live
                                    ? "#ff3b5c"
                                    : "currentColor"
                            };
                        "
                    ></span>

                    ${liveBadge}

                </div>

            </article>

        `;

    }


    function createNoMatchCard(
        sport
    ) {

        const sportClass =
            sportColors[sport] ||
            "football";

        const icon =
            sportIcons[sport] ||
            "fa-trophy";

        const sportName =
            sportNames[sport] ||
            sport;


        return `

            <article
                class="sport-card ${sportClass}"
                data-sport-card="${sport}"
            >

                <div class="sport-icon">

                    <i class="fa-solid ${icon}"></i>

                </div>


                <h3 class="sport-name">

                    ${escapeSportHTML(
                        sportName
                    )}

                </h3>


                <div class="sport-status">

                    <span
                        class="status-dot"
                    ></span>

                    No live match right now

                </div>

            </article>

        `;

    }


    function addSportScoreAttribution() {

        const existing =
            document.getElementById(
                "sportScoreAttribution"
            );

        if (existing) {
            return;
        }


        if (!sportsGrid) {
            return;
        }


        const attribution =
            document.createElement("div");


        attribution.id =
            "sportScoreAttribution";


        attribution.style.cssText = `
            grid-column:1/-1;
            text-align:right;
            margin-top:4px;
            font-size:9px;
            color:#707b92;
        `;


        attribution.innerHTML = `
            Data from
            <a
                href="https://sportscore.com/"
                target="_blank"
                rel="dofollow noopener noreferrer"
                style="
                    color:#20d9e8;
                    font-weight:800;
                "
            >
                SportScore
            </a>
        `;


        sportsGrid.appendChild(
            attribution
        );

    }


    async function loadLiveSports() {

        if (!sportsGrid) {
            return;
        }


        sportsGrid.innerHTML = `

            <article
                class="sport-card cricket"
            >

                <div class="sport-icon">

                    <i
                        class="fa-solid
                        fa-spinner fa-spin"
                    ></i>

                </div>

                <h3 class="sport-name">
                    Loading Live Scores...
                </h3>

                <div class="sport-status">
                    Connecting to SportScore
                </div>

            </article>

        `;


        const sports = [
            "cricket",
            "football",
            "tennis",
            "basketball"
        ];


        const results =
            await Promise.all(
                sports.map(
                    sport =>
                        fetchSportMatches(
                            sport
                        )
                )
            );


        liveSportsData =
            results.flat();


        if (!liveSportsData.length) {

            sportsGrid.innerHTML = `

                <article
                    class="sport-card cricket"
                    data-sport-card="cricket"
                >

                    <div class="sport-icon">

                        <i
                            class="fa-solid
                            fa-circle-exclamation"
                        ></i>

                    </div>

                    <h3 class="sport-name">
                        Live Sports
                    </h3>

                    <div class="sport-status">
                        No live scores available right now
                    </div>

                </article>

            `;

            addSportScoreAttribution();

            return;

        }


        renderSports(
            "all"
        );

    }


    function renderSports(
        selectedSport
    ) {

        if (!sportsGrid) {
            return;
        }


        let matches;


        if (
            selectedSport ===
            "all"
        ) {

            matches =
                liveSportsData;

        } else {

            matches =
                liveSportsData.filter(
                    match =>
                        match.sport ===
                        selectedSport
                );

        }


        if (!matches.length) {

            if (
                selectedSport ===
                "all"
            ) {

                sportsGrid.innerHTML =
                    `
                    <article
                        class="sport-card cricket"
                    >

                        <div class="sport-icon">

                            <i
                                class="fa-solid
                                fa-circle-info"
                            ></i>

                        </div>

                        <h3 class="sport-name">
                            No live matches
                        </h3>

                        <div class="sport-status">
                            There are no live matches right now.
                        </div>

                    </article>
                    `;

            } else {

                sportsGrid.innerHTML =
                    createNoMatchCard(
                        selectedSport
                    );

            }


            addSportScoreAttribution();

            return;

        }


        sportsGrid.innerHTML =
            matches
                .map(
                    match =>
                        createSportCard(
                            match
                        )
                )
                .join("");


        addSportScoreAttribution();

    }


    /* =====================================================
       SPORTS TABS
    ====================================================== */

    sportTabs.forEach(tab => {

        tab.addEventListener(
            "click",
            () => {

                sportTabs.forEach(
                    item => {

                        item.classList
                            .remove(
                                "active"
                            );

                    }
                );


                tab.classList.add(
                    "active"
                );


                const selectedSport =
                    tab.dataset.sport;


                renderSports(
                    selectedSport
                );

            }
        );

    });


    /* =====================================================
       START LIVE SPORTS
    ====================================================== */

    loadLiveSports();


    /* Refresh every 60 seconds */

    setInterval(
        () => {

            loadLiveSports();

        },
        60000
    );


    /* =====================================================
       PERSON SEARCH — PLACEHOLDER
    ====================================================== */

    const personForm =
        document.getElementById(
            "personSearchForm"
        );

    const personInput =
        document.getElementById(
            "personSearchInput"
        );

    const personResults =
        document.getElementById(
            "personResults"
        );


    function showPersonMessage(name) {

        if (!personResults) {
            return;
        }


        personResults.innerHTML = `

            <div
                style="
                    padding:18px;
                    border:1px solid rgba(32,217,232,0.16);
                    border-radius:14px;
                    background:rgba(32,217,232,0.04);
                    color:#a9b2c7;
                    font-size:11px;
                "
            >

                <strong
                    style="
                        display:block;
                        color:#20d9e8;
                        margin-bottom:5px;
                    "
                >
                    Searching for:
                </strong>

                ${escapeHTML(name)}

                <div
                    style="
                        margin-top:7px;
                        color:#707b92;
                        font-size:9px;
                    "
                >
                    Biography service will be connected
                    in the next backend stage.
                </div>

            </div>

        `;

    }


    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    if (personForm) {

        personForm.addEventListener(
            "submit",
            event => {

                event.preventDefault();


                const name =
                    personInput.value.trim();


                if (!name) {

                    personInput.focus();

                    return;

                }


                showPersonMessage(name);

            }
        );

    }


    /* =====================================================
       POPULAR PERSON TAGS
    ====================================================== */

    document
        .querySelectorAll(".person-tag")
        .forEach(tag => {

            tag.addEventListener(
                "click",
                () => {

                    const name =
                        tag.dataset.person;


                    if (personInput) {

                        personInput.value =
                            name;

                        personInput.focus();

                    }

                }
            );

        });


    /* =====================================================
       NAV SEARCH
    ====================================================== */

    const navSearchButton =
        document.getElementById(
            "navSearchButton"
        );


    if (navSearchButton) {

        navSearchButton.addEventListener(
            "click",
            () => {

                const people =
                    document.getElementById(
                        "people"
                    );


                if (people) {

                    people.scrollIntoView({
                        behavior: "smooth"
                    });


                    setTimeout(
                        () => {

                            if (personInput) {
                                personInput.focus();
                            }

                        },
                        500
                    );

                }

            }
        );

    }


    /* =====================================================
       DEMO TICKER ROTATION
    ====================================================== */

    const tickerMessages = [

        "AA Creative Studio — Pakistan's digital information hub",

        "Latest Pakistan news will update automatically",

        "Live cricket, football, hockey and tennis updates",

        "Search biographies and information about notable people",

        "Trusted Pakistani news sources in one place"

    ];


    let tickerIndex = 0;


    const tickerText =
        document.getElementById(
            "tickerText"
        );


    setInterval(
        () => {

            if (!tickerText) {
                return;
            }


            tickerIndex =
                (
                    tickerIndex + 1
                ) %
                tickerMessages.length;


            tickerText.style.opacity =
                "0";


            setTimeout(
                () => {

                    tickerText.textContent =
                        tickerMessages[
                            tickerIndex
                        ];

                    tickerText.style.opacity =
                        "1";

                },
                250
            );

        },
        4500
    );


</script>
