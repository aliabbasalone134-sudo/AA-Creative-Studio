<script>

/* =====================================================
   YEAR
====================================================== */

const currentYear =
    document.getElementById("currentYear");

if (currentYear) {
    currentYear.textContent =
        new Date().getFullYear();
}


/* =====================================================
   MOBILE MENU
====================================================== */

const menuButton =
    document.getElementById("menuButton");

const mobileNav =
    document.getElementById("mobileNav");

const mobileClose =
    document.getElementById("mobileClose");

const mobileOverlay =
    document.getElementById("mobileOverlay");


function openMobileMenu() {

    if (!mobileNav) return;

    mobileNav.classList.add("open");

    if (mobileOverlay) {
        mobileOverlay.classList.add("show");
    }

    document.body.style.overflow = "hidden";
}


function closeMobileMenu() {

    if (!mobileNav) return;

    mobileNav.classList.remove("open");

    if (mobileOverlay) {
        mobileOverlay.classList.remove("show");
    }

    document.body.style.overflow = "";
}


if (menuButton) {
    menuButton.addEventListener(
        "click",
        openMobileMenu
    );
}


if (mobileClose) {
    mobileClose.addEventListener(
        "click",
        closeMobileMenu
    );
}


if (mobileOverlay) {
    mobileOverlay.addEventListener(
        "click",
        closeMobileMenu
    );
}


document
    .querySelectorAll(".mobile-links a")
    .forEach(link => {

        link.addEventListener(
            "click",
            closeMobileMenu
        );

    });


/* =====================================================
   REVEAL ANIMATION
====================================================== */

const revealObserver =
    new IntersectionObserver(
        entries => {

            entries.forEach(entry => {

                if (entry.isIntersecting) {

                    entry.target
                        .classList
                        .add("visible");

                    revealObserver.unobserve(
                        entry.target
                    );

                }

            });

        },
        {
            threshold: 0.08
        }
    );


document
    .querySelectorAll(".reveal")
    .forEach(element => {

        revealObserver.observe(element);

    });


/* =====================================================
   BACK TO TOP
====================================================== */

const backTop =
    document.getElementById("backTop");


window.addEventListener(
    "scroll",
    () => {

        if (!backTop) return;

        if (window.scrollY > 500) {

            backTop.classList.add("show");

        } else {

            backTop.classList.remove("show");

        }

    },
    {
        passive: true
    }
);


if (backTop) {

    backTop.addEventListener(
        "click",
        () => {

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }
    );

}


/* =====================================================
   LIVE SPORTS
   SPORTScore API
====================================================== */

const SPORT_API =

const supportedSports = [

const sportInfo = {

    },

        name: "Basketball",
        icon: "fa-basketball"
    },

/* =====================================================
   HTML ESCAPE
====================================================== */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   GET TEAM NAME
====================================================== */

function getTeamName(team) {

    if (!team) {
        return "Unknown Team";
    }

    if (typeof team === "string") {
        return team;
    }

    return (
        team.name ||
        team.title ||
        team.short_name ||
        team.shortName ||
        "Unknown Team"
    );

}


/* =====================================================
   GET TEAM LOGO
====================================================== */

function getTeamLogo(team) {

    if (!team || typeof team === "string") {
        return "";
    }

    return (
        team.logo ||
        team.logo_url ||
        team.logoUrl ||
        team.image ||
        team.image_url ||
        ""
    );

}


/* =====================================================
   GET SCORE
====================================================== */

function getScore(
    match,
    side
) {

    const scoreKey =
        side === "home"
            ? "home_score"
            : "away_score";

    const alternateKey =
        side === "home"
            ? "homeScore"
            : "awayScore";

    const value =
        match?.[scoreKey] ??
        match?.[alternateKey];

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {
        return "—";
    }

    return escapeHTML(value);

}


/* =====================================================
   GET COMPETITION
====================================================== */

function getCompetition(match, sport) {

    const competition =
        match?.competition;

    if (
        competition &&
        typeof competition === "object"
    ) {

        return (
            competition.name ||
            competition.title ||
            match?.league_name ||
            match?.league ||
            sportInfo[sport].name
        );

    }

    if (
        typeof competition === "string" &&
        competition.trim()
    ) {

        return competition;

    }

    return (
        match?.league_name ||
        match?.league ||
        sportInfo[sport].name
    );

}


/* =====================================================
   GET MATCH TIME
====================================================== */

function getMatchTime(match) {

    return (
        match?.time ||
        match?.start_time ||
        match?.startTime ||
        match?.date ||
        match?.datetime ||
        match?.match_time ||
        ""
    );

}


/* =====================================================
   FORMAT TIME
====================================================== */

function formatMatchTime(value) {

    if (!value) {
        return "Time unavailable";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return escapeHTML(value);

    }

    return date.toLocaleString(
        undefined,
        {
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =====================================================
   MATCH STATUS
====================================================== */

function getMatchStatus(match) {

    return String(
        match?.status ||
        match?.state ||
        match?.match_status ||
        ""
    ).toLowerCase();

}


function isLive(match) {

    const status =
        getMatchStatus(match);

    return (
        status.includes("live") ||
        status.includes("playing") ||
        status.includes("in progress") ||
        status.includes("progress") ||
        status.includes("1st") ||
        status.includes("2nd") ||
        status.includes("3rd") ||
        status.includes("4th")
    );

}


/* =====================================================
   STATUS TEXT
====================================================== */

function getStatusText(match) {

    const status =
        getMatchStatus(match);

    if (isLive(match)) {

        return "LIVE";

    }

    if (
        status.includes("finish") ||
        status.includes("complete") ||
        status.includes("ended")
    ) {

        return "RESULT";

    }

    if (
        status.includes("cancel") ||
        status.includes("postpon")
    ) {

        return "POSTPONED";

    }

    return "UPCOMING";

}


/* =====================================================
   NORMALIZE API MATCH
====================================================== */

function normalizeMatch(
    match,
    sport
) {

    return {

        sport,

        home:
            getTeamName(
                match?.home ??
                match?.home_team ??
                match?.homeTeam ??
                match?.teams?.home
            ),

        away:
            getTeamName(
                match?.away ??
                match?.away_team ??
                match?.awayTeam ??
                match?.teams?.away
            ),

        homeLogo:
            getTeamLogo(
                match?.home ??
                match?.home_team ??
                match?.homeTeam ??
                match?.teams?.home
            ),

        awayLogo:
            getTeamLogo(
                match?.away ??
                match?.away_team ??
                match?.awayTeam ??
                match?.teams?.away
            ),

        homeScore:
            getScore(
                match,
                "home"
            ),

        awayScore:
            getScore(
                match,
                "away"
            ),

        status:
            getStatusText(match),

        competition:
            getCompetition(
                match,
                sport
            ),

        time:
            getMatchTime(match)

    };

}


/* =====================================================
   API RESPONSE NORMALIZATION
====================================================== */

function extractMatches(data) {

    if (Array.isArray(data)) {
        return data;
    }

    if (
        data &&
        Array.isArray(data.matches)
    ) {
        return data.matches;
    }

    if (
        data &&
        Array.isArray(data.data)
    ) {
        return data.data;
    }

    if (
        data &&
        data.data &&
        Array.isArray(data.data.matches)
    ) {
        return data.data.matches;
    }

    if (
        data &&
        Array.isArray(data.results)
    ) {
        return data.results;
    }

    return [];

}


/* =====================================================
   TEAM HTML
====================================================== */

function teamHTML(
    name,
    logo,
    score
) {

    const safeName =
        escapeHTML(name);

    const safeScore =
        escapeHTML(score);

    let logoHTML;

    if (logo) {

        logoHTML = `
            <img
                src="${escapeHTML(logo)}"
                alt=""
                loading="lazy"
                onerror="this.style.display='none';this.nextElementSibling.style.display='grid';"
            >
            <span
                class="live-team-fallback"
                style="display:none;"
            >
                <i class="fa-solid fa-shield"></i>
            </span>
        `;

    } else {

        logoHTML = `
            <span class="live-team-fallback">
                <i class="fa-solid fa-shield"></i>
            </span>
        `;

    }

    return `

        <div class="live-team">

            <div class="live-team-logo">
                ${logoHTML}
            </div>

            <div class="live-team-name">
                ${safeName}
            </div>

            <div class="live-team-score">
                ${safeScore}
            </div>

        </div>

    `;

}

/* =====================================================
   RENDER SPORTS
====================================================== */

function renderSports() {

    if (!sportsGrid) return;

    const allMatches = [];

    Object.keys(sportsData)
        .forEach(sport => {

            const matches =
                sportsData[sport] || [];

            matches.forEach(match => {

                allMatches.push(match);

            });

        });


    let visibleMatches =
        allMatches;


    if (
        selectedSport !== "all"
    ) {

        visibleMatches =
            allMatches.filter(
                match =>
                    match.sport ===
                    selectedSport
            );

    }


    if (!visibleMatches.length) {

        const title =
            selectedSport === "all"
                ? "No live matches right now"
                : `No ${escapeHTML(
                    sportInfo[selectedSport]?.name ||
                    selectedSport
                  )} matches right now`;

        sportsGrid.innerHTML = `

            <div class="live-empty">

                <div class="live-empty-icon">
                    <i class="fa-solid fa-trophy"></i>
                </div>

                <div class="live-empty-title">
                    ${title}
                </div>

                <div class="live-empty-text">
                    The sports feed will update automatically
                    when matches are available.
                </div>

            </div>

        `;

        return;

    }


    sportsGrid.innerHTML =
        visibleMatches
            .slice(0, 20)
            .map(match => {

                const info =
                    sportInfo[match.sport];

                const live =
                    match.status === "LIVE";

                const statusClass =
                    match.status === "UPCOMING"
                        ? "upcoming"
                        : match.status === "RESULT"
                            ? "result"
                            : match.status === "POSTPONED"
                                ? "postponed"
                                : "";

                return `

                    <article
                        class="live-sports-card ${match.sport}"
                    >

                        <div class="live-sports-top">

                            <div
                                class="live-sports-league"
                                title="${escapeHTML(match.competition)}"
                            >
                                <i class="fa-solid ${info.icon}"></i>
                                ${escapeHTML(match.competition)}
                            </div>

                            <div
                                class="live-sports-status ${statusClass}"
                            >

                                ${
                                    live
                                    ? `<span class="live-status-dot"></span>`
                                    : ""
                                }

                                ${escapeHTML(match.status)}

                            </div>

                        </div>


                        <div class="live-sports-teams">

                            ${teamHTML(
                                match.home,
                                match.homeLogo,
                                match.homeScore
                            )}

                            ${teamHTML(
                                match.away,
                                match.awayLogo,
                                match.awayScore
                            )}

                        </div>


                        <div class="live-sports-footer">

                            <div class="live-sports-time">

                                <i class="fa-regular fa-clock"></i>

                                ${
                                    match.time
                                    ? formatMatchTime(match.time)
                                    : "Time unavailable"
                                }

                            </div>

                            <div class="live-sports-name">

                                <i class="fa-solid ${info.icon}"></i>

                                ${escapeHTML(info.name)}

                            </div>

                        </div>

                    </article>

                `;

            })
            .join("");


}


/* =====================================================
   LOAD ONE SPORT
====================================================== */

async function loadSport(sport) {

    try {

        const response =
            await fetch(
                `${SPORT_API}?sport=${encodeURIComponent(sport)}&limit=10`,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        const matches =
            extractMatches(data);


        sportsData[sport] =
            matches.map(
                match =>
                    normalizeMatch(
                        match,
                        sport
                    )
            );


    } catch (error) {

        console.warn(
            `Unable to load ${sport} sports data:`,
            error
        );

        sportsData[sport] = [];

    }

}


/* =====================================================
   LOAD ALL LIVE SPORTS
====================================================== */

async function loadLiveSports() {

    if (
        !sportsGrid ||
        sportsLoading
    ) {
        return;
    }


    sportsLoading = true;


    injectSportsStyles();


    sportsGrid.innerHTML = `

        <div class="live-loading">

            <div>
                <i class="fa-solid fa-spinner fa-spin"></i>
            </div>

            Loading live sports...

        </div>

    `;


    await Promise.all(
        supportedSports.map(
            sport =>
                loadSport(sport)
        )
    );


    renderSports();


    sportsLoading = false;

}

   SPORTS TAB FILTER
====================================================== */

    tab.addEventListener(
        "click",
        () => {

            sportTabs.forEach(
                item =>
                    item.classList.remove(
                        "active"
                    )
            );


            tab.classList.add(
                "active"
            );


            selectedSport =
                tab.dataset.sport ||
                "all";


            renderSports();

        }
    );

});

   INITIAL SPORTS LOAD

/* =====================================================
   TICKER
====================================================== */

const tickerMessages = [

    "AA Creative Studio — Pakistan's digital information hub",

    "Latest Pakistan news will update automatically",

    "Live cricket, football, tennis and basketball updates",

    "Search biographies and information about notable people",

    "Trusted Pakistani news sources in one place"

];


let tickerIndex = 0;


const tickerText =
    document.getElementById(
        "tickerText"
    );


setInterval(
    () => {

        if (!tickerText) return;


        tickerIndex =
            (
                tickerIndex + 1
            ) %
            tickerMessages.length;


        tickerText.style.opacity =
            "0";


        setTimeout(
            () => {

                tickerText.textContent =
                    tickerMessages[
                        tickerIndex
                    ];

                tickerText.style.opacity =
                    "1";

            },
            250
        );

    },
    4500
);

</script>
