<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AA Creative Studio | Article</title>
  <meta name="description" content="Read useful and informative articles from AA Creative Studio.">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  <link id="canonical" rel="canonical" href="https://aliabbasalone134-sudo.github.io/AA-Creative-Studio/article.html">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="AA Creative Studio">
  <meta id="ogTitle" property="og:title" content="AA Creative Studio Article">
  <meta id="ogDescription" property="og:description" content="Useful and informative articles from AA Creative Studio.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #070b14;
      color: #f7f9fc;
      line-height: 1.8;
    }

    .container {
      width: min(900px, 92%);
      margin: auto;
    }

    header {
      padding: 25px 0;
      border-bottom: 1px solid #202a3d;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #20d4c7;
      text-decoration: none;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #20d4c7;
      text-decoration: none;
    }

    article {
      margin: 45px 0;
      background: #0e1524;
      padding: 35px;
      border-radius: 18px;
      border: 1px solid #202a3d;
    }

    .category {
      color: #20d4c7;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 48px);
      line-height: 1.2;
      margin-bottom: 15px;
    }

    .date {
      color: #9ca8bb;
      margin-bottom: 30px;
    }

    .content {
      white-space: pre-line;
      color: #dce3ee;
      font-size: 18px;
    }

    .content strong {
      color: white;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #9ca8bb;
      border-top: 1px solid #202a3d;
    }

    @media(max-width:600px) {
      article {
        padding: 22px;
      }

      .content {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <a class="logo" href="index.html">AA Creative Studio</a>
    <br>
    <a class="back" href="index.html#articles">← Back to Articles</a>
  </div>
</header>

<main class="container">
  <article id="article">
    <p>Loading article...</p>
  </article>
</main>

<footer>
  © 2026 AA Creative Studio. All Rights Reserved.
</footer>

<script>
async function loadArticle() {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id) {
    document.getElementById("article").innerHTML =
      "<h1>Article Not Found</h1><p>Please select an article from the Articles page.</p>";
    return;
  }

  try {

    const response = await fetch("articles.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Unable to load articles");
    }

    const articles = await response.json();

    const article = articles.find(item => String(item.id) === String(id));

    if (!article) {
      document.getElementById("article").innerHTML =
        "<h1>Article Not Found</h1><p>The requested article could not be found.</p>";
      return;
    }

    document.title = article.title + " | AA Creative Studio";

    const description = article.content
      .replace(/\s+/g, " ")
      .substring(0, 155);

    document.querySelector('meta[name="description"]')
      .setAttribute("content", description);

    const currentURL =
      window.location.origin +
      window.location.pathname +
      "?id=" + encodeURIComponent(article.id);

    document.getElementById("canonical")
      .setAttribute("href", currentURL);

    document.getElementById("ogTitle")
      .setAttribute("content", article.title);

    document.getElementById("ogDescription")
      .setAttribute("content", description);

    document.getElementById("article").innerHTML = `
      <div class="category">${escapeHTML(article.category)}</div>

      <h1>${escapeHTML(article.title)}</h1>

      <div class="date">
        Published: ${escapeHTML(article.date)}
      </div>

      <div class="content">
        ${escapeHTML(article.content)}
      </div>
    `;

    addArticleSchema(article, currentURL);

  } catch (error) {

    document.getElementById("article").innerHTML =
      "<h1>Unable to Load Article</h1><p>Please try again later.</p>";

  }
}

function escapeHTML(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function addArticleSchema(article, url) {

  const schema = {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": article.title,
    "description": article.content
      .replace(/\s+/g, " ")
      .substring(0, 155),
    "datePublished": article.date,
    "dateModified": article.date,
    "author": {
      "@type": "Organization",
      "name": "AA Creative Studio"
    },
    "publisher": {
      "@type": "Organization",
      "name": "AA Creative Studio"
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": url
    }
  };

  const script = document.createElement("script");
  script.type = "application/ld+json";
  script.textContent = JSON.stringify(schema);

  document.head.appendChild(script);
}

loadArticle();
</script>

</body>
</html>
