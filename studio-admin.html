<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Admin | AA Creative Studio</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070b14;
  color:#fff;
  min-height:100vh;
}

.container{
  width:min(1000px,92%);
  margin:auto;
}

header{
  padding:22px 0;
  border-bottom:1px solid #263044;
  margin-bottom:30px;
}

.logo{
  font-size:24px;
  font-weight:800;
}

.logo span{
  color:#7c5cff;
}

.card{
  background:#0e1524;
  border:1px solid #263044;
  border-radius:18px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1{
  margin-bottom:8px;
}

h2{
  margin-bottom:18px;
}

.muted{
  color:#9ba6b8;
  margin-bottom:20px;
}

input,textarea,select{
  width:100%;
  background:#080d18;
  color:#fff;
  border:1px solid #303b50;
  border-radius:10px;
  padding:14px;
  margin-top:8px;
  margin-bottom:18px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:220px;
  resize:vertical;
}

label{
  font-weight:600;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#7c5cff;
  color:#fff;
}

.secondary{
  background:#202b3d;
  color:#fff;
}

.danger{
  background:#b42335;
  color:#fff;
}

button:hover{
  opacity:.9;
}

.error{
  color:#ff7b8a;
  margin-top:10px;
}

.success{
  color:#55e6a5;
  margin-top:10px;
}

.hidden{
  display:none;
}

.article{
  border:1px solid #263044;
  border-radius:14px;
  padding:18px;
  margin-top:15px;
}

.article h3{
  margin-bottom:8px;
}

.article p{
  color:#aab3c2;
  margin:6px 0;
}

.article img{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:10px;
  margin:10px 0;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

@media(max-width:600px){
  .card{
    padding:18px;
  }

  .topbar{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">
    AA <span>Creative Studio</span>
  </div>
</header>

<!-- LOGIN -->
<section id="loginBox" class="card">
  <h1>Admin Login</h1>
  <p class="muted">AA Creative Studio Administration</p>

  <label>Username</label>
  <input id="username" type="text" placeholder="Enter username">

  <label>Password</label>
  <input id="password" type="password" placeholder="Enter password">

  <button class="primary" onclick="login()">Login</button>

  <p id="loginError" class="error"></p>
</section>


<!-- ADMIN PANEL -->
<section id="adminPanel" class="hidden">

  <div class="topbar card">
    <div>
      <h1>Admin Dashboard</h1>
      <p class="muted">Manage your articles</p>
    </div>

    <button class="secondary" onclick="logout()">Logout</button>
  </div>


  <!-- ADD ARTICLE -->
  <div class="card">

    <h2>Add New Article</h2>

    <label>Article Title</label>
    <input
      id="title"
      type="text"
      placeholder="Enter article title"
    >

    <label>Category</label>
    <select id="category">
      <option>Technology</option>
      <option>AI</option>
      <option>News</option>
      <option>Entertainment</option>
      <option>Business</option>
      <option>Other</option>
    </select>

    <label>Image URL</label>
    <input
      id="image"
      type="url"
      placeholder="https://example.com/image.jpg"
    >

    <label>Article Content</label>
    <textarea
      id="content"
      placeholder="Write your article here..."
    ></textarea>

    <button class="primary" onclick="saveArticle()">
      Save Article
    </button>

    <p id="saveMessage"></p>

  </div>


  <!-- ARTICLES -->
  <div class="card">

    <h2>Saved Articles</h2>

    <div id="articles"></div>

  </div>

</section>

</div>


<script>

/* -------------------------
   DEMO ADMIN LOGIN
-------------------------- */

const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "123456";


function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("loginError");

  if(
    username === ADMIN_USERNAME &&
    password === ADMIN_PASSWORD
  ){

    sessionStorage.setItem("studioAdmin","true");

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("adminPanel")
      .classList.remove("hidden");

    loadArticles();

  }else{

    error.textContent =
      "Username or password is incorrect.";

  }
}


/* -------------------------
   LOGOUT
-------------------------- */

function logout(){

  sessionStorage.removeItem("studioAdmin");

  document.getElementById("adminPanel")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");

}


/* -------------------------
   SAVE ARTICLE
-------------------------- */

function saveArticle(){

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value;

  const image =
    document.getElementById("image").value.trim();

  const content =
    document.getElementById("content").value.trim();

  const message =
    document.getElementById("saveMessage");


  if(!title || !content){

    message.className = "error";

    message.textContent =
      "Please enter article title and content.";

    return;
  }


  const articles =
    JSON.parse(localStorage.getItem("studioArticles") || "[]");


  const article = {

    id: Date.now(),

    title: title,

    category: category,

    image: image,

    content: content,

    date: new Date().toLocaleDateString()

  };


  articles.unshift(article);


  localStorage.setItem(
    "studioArticles",
    JSON.stringify(articles)
  );


  message.className = "success";

  message.textContent =
    "Article saved successfully.";


  document.getElementById("title").value = "";

  document.getElementById("image").value = "";

  document.getElementById("content").value = "";


  loadArticles();

}


/* -------------------------
   LOAD ARTICLES
-------------------------- */

function loadArticles(){

  const box =
    document.getElementById("articles");

  const articles =
    JSON.parse(localStorage.getItem("studioArticles") || "[]");


  if(articles.length === 0){

    box.innerHTML =
      '<p class="muted">No articles added yet.</p>';

    return;

  }


  box.innerHTML = "";


  articles.forEach(article => {

    const div =
      document.createElement("div");

    div.className = "article";


    let imageHTML = "";

    if(article.image){

      imageHTML =
        `<img src="${escapeHTML(article.image)}"
        alt="Article image"
        onerror="this.style.display='none'">`;

    }


    div.innerHTML = `

      <h3>${escapeHTML(article.title)}</h3>

      <p>
        <strong>Category:</strong>
        ${escapeHTML(article.category)}
      </p>

      <p>
        <strong>Date:</strong>
        ${escapeHTML(article.date)}
      </p>

      ${imageHTML}

      <p>
        ${escapeHTML(article.content)}
      </p>

      <br>

      <button
        class="danger"
        onclick="deleteArticle(${article.id})">
        Delete
      </button>

    `;
