<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AA Creative Studio - Admin</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#101827;
    color:white;
}

.box{
    width:90%;
    max-width:450px;
    margin:60px auto;
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    box-sizing:border-box;
}

h1,h2{
    text-align:center;
}

input,textarea,select{
    width:100%;
    padding:13px;
    margin:8px 0 15px;
    box-sizing:border-box;
    border-radius:8px;
    border:1px solid #475569;
    background:#0f172a;
    color:white;
    font-size:16px;
}

textarea{
    height:150px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#22c55e;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

#panel{
    display:none;
}

.error{
    color:#f87171;
    text-align:center;
    margin-top:15px;
}

.success{
    color:#4ade80;
    text-align:center;
    margin-top:15px;
}

.article{
    background:#0f172a;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
}

.delete{
    background:#ef4444;
    margin-top:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="box">

<h1>AA Creative Studio</h1>
<h2>Admin Login</h2>

<label>Username</label>

<input
id="username"
type="text"
placeholder="Enter username"
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Enter password"
>

<button type="button" onclick="loginAdmin()">
Login
</button>

<div id="loginError" class="error"></div>

</div>


<!-- ADMIN PANEL -->
<div id="panel" class="box">

<h1>Admin Panel</h1>

<button
type="button"
onclick="logoutAdmin()"
style="background:#ef4444;margin-bottom:25px;"
>
Logout
</button>

<h2>Add Article</h2>

<label>Article Title</label>

<input
id="title"
type="text"
placeholder="Enter article title"
>

<label>Category</label>

<select id="category">

<option>Technology</option>
<option>Design</option>
<option>Video Editing</option>
<option>Graphic Design</option>
<option>Other</option>

</select>

<label>Image URL</label>

<input
id="image"
type="text"
placeholder="Image URL"
>

<label>Article Content</label>

<textarea
id="content"
placeholder="Write article here..."
></textarea>

<button
type="button"
onclick="saveArticle()"
>
Save Article
</button>

<div id="message"></div>

<hr style="margin:30px 0;border-color:#475569;">

<h2>Articles</h2>

<div id="articles">
No articles yet.
</div>

</div>


<script>

function loginAdmin(){

    var username =
        document.getElementById("username").value.trim();

    var password =
        document.getElementById("password").value;

    if(username === "admin" && password === "123456"){

        document.getElementById("login").style.display = "none";

        document.getElementById("panel").style.display = "block";

        document.getElementById("loginError").innerHTML = "";

        loadArticles();

    }else{

        document.getElementById("loginError").innerHTML =
        "Username یا Password غلط ہے";

    }
}


function logoutAdmin(){

    document.getElementById("panel").style.display = "none";

    document.getElementById("login").style.display = "block";

    document.getElementById("username").value = "";

    document.getElementById("password").value = "";
}


function saveArticle(){

    var title =
        document.getElementById("title").value.trim();

    var category =
        document.getElementById("category").value;

    var image =
        document.getElementById("image").value.trim();

    var content =
        document.getElementById("content").value.trim();

    if(title === "" || content === ""){

        document.getElementById("message").className =
        "error";

        document.getElementById("message").innerHTML =
        "Title اور Content لازمی لکھیں۔";

        return;
    }

    var articles =
        JSON.parse(
            localStorage.getItem("aaArticles") || "[]"
        );

    articles.push({

        id:Date.now(),

        title:title,

        category:category,

        image:image,

        content:content,

        date:new Date().toLocaleDateString()

    });

    localStorage.setItem(
        "aaArticles",
        JSON.stringify(articles)
    );

    document.getElementById("title").value = "";

    document.getElementById("image").value = "";

    document.getElementById("content").value = "";

    document.getElementById("message").className =
    "success";

    document.getElementById("message").innerHTML =
    "Article saved successfully!";

    loadArticles();
}


function loadArticles(){

    var articles =
        JSON.parse(
            localStorage.getItem("aaArticles") || "[]"
        );

    var box =
        document.getElementById("articles");

    if(articles.length === 0){

        box.innerHTML = "No articles yet.";

        return;
    }

    box.innerHTML = "";

    articles.slice().reverse().forEach(function(article){

        var div =
            document.createElement("div");

        div.className = "article";

        div.innerHTML =
        "<h3>" + article.title + "</h3>" +
        "<p><b>Category:</b> " +
        article.category + "</p>" +
        "<p><b>Date:</b> " +
        article.date + "</p>" +
        "<p>" + article.content + "</p>" +
        "<button class='delete' type='button' " +
        "onclick='deleteArticle(" + article.id + ")'>" +
        "Delete Article</button>";

        box.appendChild(div);

    });
}


function deleteArticle(id){

    var articles =
        JSON.parse(
            localStorage.getItem("aaArticles") || "[]"
        );

    articles =
        articles.filter(function(article){

            return article.id !== id;

        });

    localStorage.setItem(
        "aaArticles",
        JSON.stringify(articles)
    );

    loadArticles();
}

</script>

</body>
  </html>
